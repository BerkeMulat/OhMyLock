[package]
name = "OhMyLock"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ab_glyph = "0.2.29"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
image = "0.25.10"
ndarray = "0.17.2"
nokhwa = { version = "0.10.11", features = ["input-native"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
tray-icon = "0.24.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
# For taking over the screen while locked (hiding the Dock/menu bar,
# blocking Cmd+Tab, raising the window above them) -- see
# src/kiosk_macos.rs. Pinned to the same versions winit itself already pulls
# in so this doesn't drag in a second copy of the AppKit bindings.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSRunningApplication", "NSMenu", "NSMenuItem"] }
# CGEventTap: the low-level keyboard event tap that blocks Mission Control's
# F3 (and its Control+Up/Down alternates) while locked -- see the "Mission
# Control" section of kiosk_macos.rs's module docs for why nothing in
# NSApplicationPresentationOptions covers this the way it does Cmd+Tab.
objc2-core-foundation = { version = "0.3.2", features = ["CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventTypes"] }
raw-window-handle = "0.6.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": the face-matching work runs on a
# background thread, and this app's whole point is a lock screen that can't
# get stuck. With unwinding, a panic there just ends that thread (logged,
# recoverable by re-locking); with "abort" it would kill the entire process
# -- including the always-on-top window -- from a single bad camera frame.
